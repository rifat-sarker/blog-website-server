version: "3.8"

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mixhub_dispatch_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:5173
      - DATABASE_URL=mongodb://mongodb:27017/mixhub_press
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=editorial_broadsheet_sumi_secret_key_2026
    depends_on:
      - mongodb
      - redis
    networks:
      - mixhub_network

  mongodb:
    image: mongo:7.0
    container_name: mixhub_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - mixhub_network

  redis:
    image: redis:7-alpine
    container_name: mixhub_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mixhub_network

volumes:
  mongo_data:
  redis_data:

networks:
  mixhub_network:
    driver: bridge

